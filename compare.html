<!doctype html>
<html lang="en" data-theme="battery">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compare Student Laptop Finder</title>
    <link rel="stylesheet" href="dist/output.css" />
    <script type="module" src="src/js/comparePage.js"></script>
  </head>
  <body class="flex min-h-screen flex-col bg-page text-body">
    <header
      id="site-header"
      class="sticky top-0 z-10 border-b border-line bg-surface"
    ></header>

    <main class="mx-auto w-full max-w-7xl flex-1 px-4 py-8">
      <h1 class="text-3xl font-extrabold">Compare laptops</h1>
      <p class="mt-1 text-muted">
        Choose two to four of your favorites. The best value in each row is
        highlighted.
      </p>

      <h2 class="mt-6 text-xl font-bold">1. Choose laptops</h2>
      <div
        id="picker"
        class="mt-3 grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3"
      ></div>
      <p
        id="compare-message"
        class="mt-3 text-sm font-semibold text-accent"
        role="alert"
      ></p>

      <h2 class="mt-6 text-xl font-bold">2. Side-by-side comparison</h2>
      <div id="comparison" class="mt-3"></div>
    </main>

    <footer id="site-footer" class="border-t border-line bg-surface"></footer>
  </body>
</html>
